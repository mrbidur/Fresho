@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideDown { from { transform: translateY(0); } to { transform: translateY(100%); } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes progressBar { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
@keyframes bounceIn { 0% { transform: scale(0.3); opacity: 0; } 50% { transform: scale(1.05); } 70% { transform: scale(0.9); } 100% { transform: scale(1); opacity: 1; } }

@keyframes pullRefresh { 0% { transform: translateY(-60px) rotate(0deg); } 100% { transform: translateY(0) rotate(360deg); } }
@keyframes splashFade { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; pointer-events: none; } }
@keyframes fabPulse { 0%, 100% { box-shadow: 0 4px 15px rgba(168,85,247,0.4); } 50% { box-shadow: 0 4px 25px rgba(168,85,247,0.7); } }
.animate-fadeIn { animation: fadeIn 0.3s ease-out; }
.animate-slideUp { animation: slideUp 0.35s cubic-bezier(0.32, 0.72, 0, 1); }
.animate-slideDown { animation: slideDown 0.3s ease-in forwards; }
.animate-slideInRight { animation: slideInRight 0.3s ease-out; }
.animate-pulse-once { animation: pulse 0.5s ease-out; }
.animate-spin { animation: spin 1s linear infinite; }
.animate-shimmer { background: linear-gradient(90deg, #a855f7 25%, #ec4899 50%, #a855f7 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
.animate-progress { animation: progressBar 2.5s ease-in-out forwards; }
.animate-bounceIn { animation: bounceIn 0.5s ease-out; }
.animate-tap { animation: tapScale 0.15s ease-out; }
.animate-splash { animation: splashFade 2s ease-out forwards; }
.animate-fab { animation: fabPulse 2s ease-in-out infinite; }
.bottom-nav { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 4px); }
.modal-fullscreen { 
  position: fixed; inset: 0; z-index: 50;
  padding-top: env(safe-area-inset-top);
}
.touch-target { min-height: 44px; min-width: 44px; }
.scroll-snap-x { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }

.pull-indicator { transition: transform 0.2s ease; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

function App() {
  const [showSplash, setShowSplash] = useState(true);
  const [activeTab, setActiveTab] = useState('home');
  const [view, setView] = useState('client');
  const [selectedCategory, setSelectedCategory] = useState('hair');
  const [searchQuery, setSearchQuery] = useState('');
  const [modalOpen, setModalOpen] = useState(false);
  const [selectedVenue, setSelectedVenue] = useState(null);
  const [bookingStep, setBookingStep] = useState(1);
  const [selectedService, setSelectedService] = useState(null);
  const [selectedTime, setSelectedTime] = useState(null);
  const [selectedStaff, setSelectedStaff] = useState(null);
  const [bookingSuccess, setBookingSuccess] = useState(false);
  const [bookings, setBookings] = useState([]);
  const [completedBookings, setCompletedBookings] = useState([]);
  const [selectedMerchant, setSelectedMerchant] = useState('h1');
  const [walletBalances, setWalletBalances] = useState({ h1: 2500, d1: 5000 });
  const [revenues, setRevenues] = useState({ h1: 0, d1: 0 });
  const [toast, setToast] = useState(null);
  const [paymentMethod, setPaymentMethod] = useState('venue');
  const [processingPayment, setProcessingPayment] = useState(false);
  const [selectedDate, setSelectedDate] = useState(null);
  const [refreshing, setRefreshing] = useState(false);
  const [modalClosing, setModalClosing] = useState(false);

  const merchantOptions = [
    { id: 'h1', name: 'Durbarmarg Hair Studio' },
    { id: 'd1', name: 'Kathmandu Dental Clinic' },
  ];

  useEffect(() => {
    const timer = setTimeout(() => setShowSplash(false), 1800);
    return () => clearTimeout(timer);
  }, []);

  const showToast = (message) => {
    setToast(message);
    setTimeout(() => setToast(null), 3000);
  };

  const handleRefresh = () => {
    setRefreshing(true);
    setTimeout(() => setRefreshing(false), 1200);
  };

  const openModal = (venue) => {
    setSelectedVenue(venue);
    setBookingStep(1);
    setSelectedService(null);
    setSelectedTime(null);
    setSelectedStaff(null);
    setSelectedDate(null);
    setBookingSuccess(false);
    setPaymentMethod('venue');
    setProcessingPayment(false);
    setModalClosing(false);
    setModalOpen(true);
  };

  const closeModal = () => {
    setModalClosing(true);
    setTimeout(() => {
      setModalOpen(false);
      setSelectedVenue(null);
      setModalClosing(false);
    }, 280);
  };

  const confirmBooking = () => {
    if (paymentMethod === 'digital') {
      setProcessingPayment(true);
      setTimeout(() => {
        const commission = Math.round(selectedService.price * 0.10);
        const merchantId = selectedVenue.id;
        setWalletBalances(prev => ({ ...prev, [merchantId]: (prev[merchantId] || 0) - commission }));
        const newBooking = {
          id: Date.now(),
          venue: selectedVenue.name,
          venueId: selectedVenue.id,
          service: selectedService.name,
          price: selectedService.price,
          time: selectedTime,
          date: selectedDate,
          staff: selectedStaff,
          client: 'Guest Client',
          status: 'upcoming',
          prepaid: true,
        };
        setBookings(prev => [...prev, newBooking]);
        setProcessingPayment(false);
        setBookingSuccess(true);
        showToast(`Payment of Rs. ${selectedService.price.toLocaleString()} processed`);
      }, 2800);
    } else {
      const newBooking = {
        id: Date.now(),
        venue: selectedVenue.name,
        venueId: selectedVenue.id,
        service: selectedService.name,
        price: selectedService.price,
        time: selectedTime,
        date: selectedDate,
        staff: selectedStaff,
        client: 'Guest Client',
        status: 'upcoming',
        prepaid: false,
      };
      setBookings(prev => [...prev, newBooking]);
      setBookingSuccess(true);
    }
  };

  const completeBooking = (booking) => {
    const commission = Math.round(booking.price * 0.10);
    const merchantId = booking.venueId;
    if (!booking.prepaid) {
      setWalletBalances(prev => ({ ...prev, [merchantId]: (prev[merchantId] || 0) - commission }));
    }
    setRevenues(prev => ({ ...prev, [merchantId]: (prev[merchantId] || 0) + booking.price }));
    setBookings(prev => prev.filter(b => b.id !== booking.id));
    setCompletedBookings(prev => [...prev, { ...booking, status: 'completed', commission }]);
    showToast(`Completed! Rs. ${booking.price} collected`);
  };

  const filteredVenues = venuesData[selectedCategory].filter(v =>
    v.name.toLowerCase().includes(searchQuery.toLowerCase())
  );

  const pendingForMerchant = bookings.filter(b => b.venueId === selectedMerchant);
  const completedForMerchant = completedBookings.filter(b => b.venueId === selectedMerchant);

  if (showSplash) {
    return (
      <div className="fixed inset-0 z-[100] bg-slate-900 flex flex-col items-center justify-center animate-splash">
        <div className="animate-bounceIn">
          <div className="w-20 h-20 rounded-2xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center shadow-2xl shadow-purple-500/30">
            <span className="text-4xl font-bold text-white">F</span>
          </div>
        </div>
        <h1 className="mt-4 text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">Fresho</h1>
        <p className="mt-1 text-sm text-gray-400">Beauty & Wellness, Simplified</p>
      </div>
    );
  }

  return (
    <div className="h-screen flex flex-col bg-slate-900 text-white overflow-hidden">
      {toast && (
        <div className="fixed top-[calc(env(safe-area-inset-top,0px)+12px)] left-4 right-4 z-[60] animate-slideInRight">
          <div className="bg-green-500 text-white px-4 py-3 rounded-2xl shadow-lg flex items-center gap-2 text-sm font-medium">
            <Icons.Check /> {toast}
          </div>
        </div>
      )}

      {/* Pull to refresh indicator */}
      {refreshing && (
        <div className="fixed top-[calc(env(safe-area-inset-top,0px)+60px)] left-1/2 -translate-x-1/2 z-50">
          <div className="w-8 h-8 rounded-full border-2 border-purple-300 border-t-purple-500 animate-spin"></div>
        </div>
      )}

      {/* Main content area */}
      <div className="flex-1 overflow-y-auto no-scrollbar pb-20">
        {view === 'client' ? (
          <>
            {activeTab === 'home' && (
              <HomeTab
                selectedCategory={selectedCategory}
                setSelectedCategory={setSelectedCategory}
                searchQuery={searchQuery}
                setSearchQuery={setSearchQuery}
                filteredVenues={filteredVenues}
                openModal={openModal}
                onRefresh={handleRefresh}
              />
            )}
            {activeTab === 'bookings' && (
              <BookingsTab bookings={bookings} completedBookings={completedBookings} />
            )}
            {activeTab === 'profile' && (
              <ProfileTab />
            )}
          </>
        ) : (
          <ProviderView
            selectedMerchant={selectedMerchant}
            setSelectedMerchant={setSelectedMerchant}
            merchantOptions={merchantOptions}
            walletBalances={walletBalances}
            revenues={revenues}
            pendingForMerchant={pendingForMerchant}
            completedForMerchant={completedForMerchant}
            completeBooking={completeBooking}
          />
        )}
      </div>

      {/* Floating Action Button */}
      {view === 'client' && activeTab === 'home' && (
        <button
          onClick={() => { if (filteredVenues.length > 0) openModal(filteredVenues[0]); }}
          className="fixed bottom-24 right-5 z-40 w-14 h-14 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 text-white flex items-center justify-center shadow-xl animate-fab active:animate-tap"
        >
          <Icons.Plus />
        </button>
      )}

      {/* Bottom Navigation */}
      <nav className="fixed bottom-0 left-0 right-0 z-40 bg-slate-800/95 backdrop-blur-lg border-t border-slate-700 bottom-nav">
        <div className="flex items-center justify-around px-2 pt-2">
          {view === 'client' ? (
            <>
              <TabButton icon={<Icons.Home />} label="Home" active={activeTab === 'home'} onClick={() => setActiveTab('home')} />
              <TabButton icon={<Icons.Bookings />} label="Bookings" active={activeTab === 'bookings'} onClick={() => setActiveTab('bookings')} badge={bookings.length} />
              <TabButton icon={<Icons.Provider />} label="Provider" active={false} onClick={() => { setView('provider'); setActiveTab('home'); }} />
              <TabButton icon={<Icons.Profile />} label="Profile" active={activeTab === 'profile'} onClick={() => setActiveTab('profile')} />
            </>
          ) : (
            <>
              <TabButton icon={<Icons.Home />} label="Dashboard" active={true} onClick={() => {}} />
              <TabButton icon={<Icons.Bookings />} label="Client" active={false} onClick={() => { setView('client'); setActiveTab('home'); }} />
              <TabButton icon={<Icons.Profile />} label="Profile" active={false} onClick={() => { setView('client'); setActiveTab('profile'); }} />
            </>
          )}
        </div>
      </nav>

      {/* Booking Modal */}
      {modalOpen && selectedVenue && (
        <BookingModal
          venue={selectedVenue}
          category={selectedCategory}
          step={bookingStep}
          setStep={setBookingStep}
          selectedService={selectedService}
          setSelectedService={setSelectedService}
          selectedTime={selectedTime}
          setSelectedTime={setSelectedTime}
          selectedStaff={selectedStaff}
          setSelectedStaff={setSelectedStaff}
          selectedDate={selectedDate}
          setSelectedDate={setSelectedDate}
          bookingSuccess={bookingSuccess}
          confirmBooking={confirmBooking}
          closeModal={closeModal}
          paymentMethod={paymentMethod}
          setPaymentMethod={setPaymentMethod}
          processingPayment={processingPayment}
          closing={modalClosing}
        />
      )}
    </div>
  );
}

function TabButton({ icon, label, active, onClick, badge }) {
  return (
    <button
      onClick={onClick}
      className={`flex flex-col items-center justify-center py-1 px-3 touch-target transition-all duration-200 active:animate-tap ${active ? 'text-purple-400' : 'text-gray-400'}`}
    >
      <div className="relative">
        {icon}
        {badge > 0 && (
          <span className="absolute -top-1 -right-2 w-4 h-4 rounded-full bg-pink-500 text-[10px] font-bold flex items-center justify-center">{badge}</span>
        )}
      </div>
      <span className={`text-[10px] mt-1 font-medium ${active ? 'text-purple-400' : 'text-gray-500'}`}>{label}</span>
      {active && <div className="w-4 h-0.5 rounded-full bg-purple-400 mt-1"></div>}
    </button>
  );
}

function HomeTab({ selectedCategory, setSelectedCategory, searchQuery, setSearchQuery, filteredVenues, openModal, onRefresh }) {
  const scrollRef = useRef(null);
  const [touchStart, setTouchStart] = useState(0);
  const [pullDistance, setPullDistance] = useState(0);

  const handleTouchStart = (e) => {
    if (scrollRef.current && scrollRef.current.scrollTop === 0) {
      setTouchStart(e.touches[0].clientY);
    }
  };

  const handleTouchMove = (e) => {
    if (touchStart > 0) {
      const diff = e.touches[0].clientY - touchStart;
      if (diff > 0 && diff < 100) {
        setPullDistance(diff);
      }
    }
  };

  const handleTouchEnd = () => {
    if (pullDistance > 60) {
      onRefresh();
    }
    setTouchStart(0);
    setPullDistance(0);
  };

  return (
    <div
      ref={scrollRef}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
      className="animate-fadeIn"
    >
      {/* Pull indicator */}
      {pullDistance > 0 && (
        <div className="flex justify-center py-2 pull-indicator" style={{ transform: `translateY(${pullDistance * 0.3}px)` }}>
          <div className={`w-6 h-6 rounded-full border-2 border-purple-300 border-t-purple-500 ${pullDistance > 60 ? 'animate-spin' : ''}`} style={{ transform: `rotate(${pullDistance * 3}deg)` }}></div>
        </div>
      )}

      {/* Header */}
      <div className="px-4 pt-4 pb-2">
        <div className="flex items-center justify-between mb-1">
          <div>
            <p className="text-gray-400 text-xs">Good morning</p>
            <h1 className="text-xl font-bold">Discover</h1>
          </div>
          <div className="w-9 h-9 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-sm font-bold">
            G
          </div>
        </div>
        <div className="flex items-center gap-1 text-gray-400 text-xs">
          <Icons.MapPin />
          <span>Kathmandu, Nepal</span>
        </div>
      </div>

      {/* Search */}
      <div className="px-4 py-3">
        <div className="relative">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><Icons.Search /></span>
          <input
            type="text"
            placeholder="Search salons, clinics..."
            value={searchQuery}
            onChange={(e) => setSearchQuery(e.target.value)}
            className="w-full pl-10 pr-4 py-3 rounded-2xl bg-slate-800 border border-slate-700 text-white placeholder-gray-500 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 touch-target"
          />
        </div>
      </div>

      {/* Categories - horizontal scroll */}
      <div className="px-4 mb-4">
        <div className="flex gap-3 overflow-x-auto no-scrollbar scroll-snap-x py-1">
          {categories.map(cat => (
            <button
              key={cat.id}
              onClick={() => setSelectedCategory(cat.id)}
              className={`flex flex-col items-center gap-1.5 min-w-[72px] py-3 px-2 rounded-2xl transition-all duration-200 scroll-snap-item touch-target active:animate-tap ${
                selectedCategory === cat.id
                  ? 'bg-gradient-to-b from-purple-500/20 to-pink-500/10 border border-purple-500/50'
                  : 'bg-slate-800 border border-slate-700'
              }`}
            >
              <span className="text-2xl">{cat.emoji}</span>
              <span className={`text-[10px] font-medium whitespace-nowrap ${selectedCategory === cat.id ? 'text-purple-300' : 'text-gray-400'}`}>{cat.name.split(' ')[0]}</span>
            </button>
          ))}
        </div>
      </div>

      {/* Section Title */}
      <div className="px-4 mb-3 flex items-center justify-between">
        <h2 className="text-base font-bold">Nearby {categories.find(c => c.id === selectedCategory)?.name}</h2>
        <span className="text-xs text-purple-400 font-medium">{filteredVenues.length} found</span>

      {/* Venue Cards */}

            style={{ animationDelay: `${idx * 80}ms` }}

            <div className="h-36 relative overflow-hidden">
              <img src={venueImages[venue.id]} alt={venue.name} className="w-full h-full object-cover" />
              <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent"></div>
              <div className="absolute top-3 right-3 bg-black/40 backdrop-blur-sm rounded-full px-2.5 py-1 flex items-center gap-1">
                <span className="text-yellow-400"><Icons.Star /></span>
                <span className="text-white text-xs font-bold">{venue.rating}</span>
              </div>
              <div className="absolute bottom-3 left-3 right-3">
                <h3 className="font-bold text-base text-white">{venue.name}</h3>
                <div className="flex items-center gap-1 mt-0.5 text-gray-300 text-xs">

          )}
        </div>
      )}
    </div>
  );
}

    <div className="px-4 pt-4 animate-fadeIn">
      <h1 className="text-xl font-bold mb-6">Profile</h1>

      <div className="flex flex-col items-center mb-8">

          G
        </div>
        <h2 className="font-bold text-lg">Guest User</h2>
        <p className="text-sm text-gray-400">Kathmandu, Nepal</p>
      </div>

      <div className="space-y-3">
        {[
          { icon: <Icons.User />, label: 'Edit Profile' },
          { icon: <Icons.Calendar />, label: 'Appointment History' },
          { icon: <Icons.CreditCard />, label: 'Payment Methods' },
          { icon: <Icons.MapPin />, label: 'Saved Addresses' },
        ].map((item, idx) => (
          <button key={idx} className="w-full flex items-center gap-4 p-4 rounded-2xl bg-slate-800 border border-slate-700 touch-target active:animate-tap transition-all">
            <div className="w-10 h-10 rounded-xl bg-slate-700 flex items-center justify-center text-purple-400">
              {item.icon}
            </div>
            <span className="flex-1 text-left font-medium text-sm">{item.label}</span>
            <Icons.ChevronRight />

      <div className="mt-8 p-4 rounded-2xl bg-gradient-to-r from-purple-500/10 to-pink-500/10 border border-purple-500/20">
        <p className="text-xs text-gray-400 text-center">Fresho v1.0.0</p>
        <p className="text-[10px] text-gray-500 text-center mt-1">Appointment Marketplace for Nepal</p>

function ProviderView({ selectedMerchant, setSelectedMerchant, merchantOptions, walletBalances, revenues, pendingForMerchant, completedForMerchant, completeBooking }) {
  const walletBalance = walletBalances[selectedMerchant] || 0;
  const revenue = revenues[selectedMerchant] || 0;
  const lowBalance = walletBalance < 200;

  return (
    <div className="px-4 pt-4 animate-fadeIn">
      <h1 className="text-xl font-bold mb-4">Provider Dashboard</h1>

      {/* Merchant Selector */}
      <div className="mb-4">
        <select
          value={selectedMerchant}
          onChange={(e) => setSelectedMerchant(e.target.value)}
          className="w-full px-4 py-3 rounded-2xl bg-slate-800 border border-slate-700 text-white text-sm focus:outline-none focus:ring-2 focus:ring-purple-500 touch-target"
        >
          {merchantOptions.map(m => (
            <option key={m.id} value={m.id}>{m.name}</option>
          ))}
        </select>
      </div>

      {lowBalance && (
        <div className="mb-4 p-3 rounded-2xl bg-yellow-500/10 border border-yellow-500/30 flex items-center gap-3">
          <span className="text-yellow-400"><Icons.AlertTriangle /></span>
          <span className="text-yellow-200 text-xs font-medium">Low Balance: Top up via eSewa to avoid listing suspension.</span>
        </div>
      )}

      {/* Stats Cards */}
      <div className="grid grid-cols-2 gap-3 mb-6">
        <div className="p-4 rounded-2xl bg-slate-800 border border-slate-700">
          <div className="flex items-center gap-2 mb-2">
            <div className="w-8 h-8 rounded-xl bg-purple-500/20 flex items-center justify-center text-purple-400"><Icons.Wallet /></div>
          </div>
          <p className="text-[10px] text-gray-400 uppercase">Wallet</p>
          <p className="text-lg font-bold">Rs. {walletBalance.toLocaleString()}</p>
        </div>
        <div className="p-4 rounded-2xl bg-slate-800 border border-slate-700">
          <div className="flex items-center gap-2 mb-2">
            <div className="w-8 h-8 rounded-xl bg-green-500/20 flex items-center justify-center text-green-400"><Icons.TrendingUp /></div>
          </div>
          <p className="text-[10px] text-gray-400 uppercase">Revenue Today</p>
          <p className="text-lg font-bold">Rs. {revenue.toLocaleString()}</p>
        </div>
      </div>

      {/* Upcoming */}
      <div className="mb-6">
        <h2 className="text-base font-bold mb-3 flex items-center gap-2"><Icons.Clock /> Upcoming ({pendingForMerchant.length})</h2>
        {pendingForMerchant.length === 0 ? (
          <div className="p-6 rounded-2xl bg-slate-800 border border-slate-700 text-center">
            <p className="text-gray-400 text-sm">No upcoming appointments</p>
            <p className="text-gray-500 text-xs mt-1">Client bookings will appear here</p>
          </div>
        ) : (
          <div className="space-y-3">
            {pendingForMerchant.map(booking => (
              <div key={booking.id} className="p-4 rounded-2xl bg-slate-800 border border-slate-700">
                <div className="flex items-center gap-2 mb-2">
                  <Icons.User />
                  <span className="font-medium text-sm">{booking.client}</span>
                  {booking.prepaid && (
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-blue-500/20 text-blue-300">Prepaid</span>
                  )}
                </div>
                <p className="text-xs text-gray-400 mb-2">
                  {booking.service} - {booking.time} - {booking.staff}
                </p>
                <div className="flex items-center justify-between">
                  <span className="text-purple-400 font-semibold text-sm">Rs. {booking.price.toLocaleString()}</span>
                  <button
                    onClick={() => completeBooking(booking)}
                    className="px-4 py-2 rounded-xl bg-green-500 text-white text-xs font-medium active:animate-tap touch-target flex items-center gap-1"
                  >
                    <Icons.Check /> Complete
                  </button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Completed */}
      {completedForMerchant.length > 0 && (
        <div className="pb-6">
          <h2 className="text-base font-bold mb-3 flex items-center gap-2"><Icons.Check /> Completed</h2>
          <div className="space-y-3">
            {completedForMerchant.map(booking => (
              <div key={booking.id} className="p-4 rounded-2xl bg-slate-800/60 border border-slate-700/60">
                <div className="flex items-center gap-2 mb-1">
                  <Icons.User />
                  <span className="font-medium text-sm text-gray-300">{booking.client}</span>
                  <span className="ml-auto text-[10px] px-2 py-0.5 rounded-full bg-green-500/20 text-green-300">Done</span>
                </div>
                <p className="text-xs text-gray-500">
                  {booking.service} - Rs. {booking.price.toLocaleString()} (Commission: Rs. {booking.commission})
                </p>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function BookingModal({ venue, category, step, setStep, selectedService, setSelectedService, selectedTime, setSelectedTime, selectedStaff, setSelectedStaff, selectedDate, setSelectedDate, bookingSuccess, confirmBooking, closeModal, paymentMethod, setPaymentMethod, processingPayment, closing }) {
  const services = servicesData[category] || [];
  const staff = staffData[venue.id] || ['Staff Member 1', 'Staff Member 2', 'Staff Member 3'];
  const reviews = reviewsData[venue.id] || [];
  const [calendarMonth, setCalendarMonth] = useState(new Date().getMonth());
  const [calendarYear, setCalendarYear] = useState(new Date().getFullYear());
  const [touchStartY, setTouchStartY] = useState(0);
  const [dragY, setDragY] = useState(0);

  const handleDragStart = (e) => {
    setTouchStartY(e.touches[0].clientY);
  };
  const handleDragMove = (e) => {
    const diff = e.touches[0].clientY - touchStartY;
    if (diff > 0) setDragY(diff);
  };
  const handleDragEnd = () => {
    if (dragY > 120) closeModal();
    setDragY(0);
    setTouchStartY(0);
  };

  if (processingPayment) {
    return (
      <div className="modal-fullscreen bg-slate-900 flex items-center justify-center animate-slideUp">
        <div className="text-center px-8">
          <div className="flex justify-center mb-6">
            <div className="w-16 h-16 rounded-full border-4 border-purple-200/30 border-t-purple-500 animate-spin"></div>
          </div>
          <h3 className="text-xl font-bold mb-2">Processing Payment</h3>
          <p className="text-gray-400 text-sm mb-4">Connecting to secure payment gateway...</p>
          <div className="w-full h-2 rounded-full overflow-hidden bg-slate-700">
            <div className="h-full rounded-full animate-progress animate-shimmer"></div>
          </div>
          <div className="mt-4 flex items-center justify-center gap-2 text-gray-400">
            <Icons.CreditCard />
            <span className="text-xs">eSewa / Khalti / Fonepay</span>
          </div>
          <p className="mt-2 text-xs text-gray-500">Please do not close this window</p>
        </div>
      </div>
    );
  }

  if (bookingSuccess) {
    return (
      <div className="modal-fullscreen bg-slate-900 flex items-center justify-center animate-slideUp" onClick={closeModal}>
        <div className="text-center px-8" onClick={e => e.stopPropagation()}>
          <div className="text-green-400 flex justify-center mb-4 animate-bounceIn"><Icons.CheckCircle /></div>
          <h3 className="text-2xl font-bold mb-2">Booking Confirmed!</h3>
          <p className="text-gray-400 mb-3 text-sm">Your appointment at {venue.name} has been booked.</p>
          <p className="text-xs text-gray-500 mb-4">{selectedService?.name} - {selectedTime} with {selectedStaff}</p>
          {paymentMethod === 'digital' && (
            <div className="mb-4 px-4 py-2 rounded-xl bg-blue-500/10 border border-blue-500/30">
              <p className="text-sm text-blue-300 font-medium">Paid via Digital Wallet - Rs. {selectedService?.price.toLocaleString()}</p>
            </div>
          )}
          <button onClick={closeModal} className="w-full py-4 rounded-2xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold touch-target active:animate-tap">
            Done
          </button>
        </div>
      </div>
    );
  }

  return (
    <div
      className={`modal-fullscreen bg-slate-900 ${closing ? 'animate-slideDown' : 'animate-slideUp'}`}
      style={dragY > 0 ? { transform: `translateY(${dragY}px)`, opacity: Math.max(0, 1 - dragY / 300) } : {}}
    >
      {/* Drag handle */}
      <div
        className="flex justify-center pt-3 pb-2"
        onTouchStart={handleDragStart}
        onTouchMove={handleDragMove}
        onTouchEnd={handleDragEnd}
      >
        <div className="w-10 h-1 rounded-full bg-slate-600"></div>
      </div>

      {/* Header */}
      <div className="flex items-center justify-between px-4 pb-3">
        <div className="flex items-center gap-3">
          {step > 1 && (
            <button onClick={() => setStep(step - 1)} className="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center touch-target active:animate-tap">
              <Icons.ChevronLeft />
            </button>
          )}
          <div>
            <h2 className="text-base font-bold">{venue.name}</h2>
            <div className="flex items-center gap-1 mt-0.5">
              {[1, 2, 3].map(s => (
                <div key={s} className={`w-8 h-1 rounded-full ${s <= step ? 'bg-purple-500' : 'bg-slate-700'}`} />
              ))}
              <span className="text-[10px] text-gray-500 ml-1">Step {step}/3</span>
            </div>
          </div>
        </div>
        <button onClick={closeModal} className="w-9 h-9 rounded-full bg-slate-800 flex items-center justify-center touch-target active:animate-tap">
          <Icons.X />
        </button>
      </div>

      {/* Content */}
      <div className="flex-1 overflow-y-auto px-4 pb-8 no-scrollbar" style={{ height: 'calc(100vh - 80px - env(safe-area-inset-top, 0px))' }}>
        {/* Venue Image */}
        <div className="mb-4 rounded-2xl overflow-hidden h-32">
          <img src={venueImages[venue.id]} alt={venue.name} className="w-full h-full object-cover" />
        </div>

        {step === 1 && (
          <div className="animate-slideInRight">
            <h3 className="font-bold text-sm mb-3 text-gray-300 uppercase tracking-wide">Select a Service</h3>
            <div className="space-y-2 mb-6">
              {services.map((service, idx) => (
                <button
                  key={idx}
                  onClick={() => { setSelectedService(service); setStep(2); }}
                  className={`w-full p-4 rounded-2xl border text-left transition-all duration-200 flex items-center justify-between touch-target active:animate-tap ${
                    selectedService?.name === service.name
                      ? 'border-purple-500 bg-purple-500/10'
                      : 'border-slate-700 bg-slate-800'
                  }`}
                >
                  <span className="font-medium text-sm">{service.name}</span>
                  <span className="text-purple-400 font-bold text-sm">Rs. {service.price.toLocaleString()}</span>
                </button>
              ))}
            </div>

            {/* Reviews */}
            {reviews.length > 0 && (
              <div className="p-4 rounded-2xl bg-slate-800 border border-slate-700 mb-4">
                <h4 className="font-bold text-sm mb-3 flex items-center gap-2">
                  <span className="text-yellow-400"><Icons.Star /></span>
                  Reviews
                </h4>
                <div className="space-y-3">
                  {reviews.map((review, idx) => (
                    <div key={idx} className="p-3 rounded-xl bg-slate-700/50">
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-xs font-medium">{review.name}</span>
                        <div className="flex items-center gap-0.5">
                          {Array.from({ length: review.rating }, (_, i) => (
                            <span key={i} className="text-yellow-400"><Icons.Star /></span>
                          ))}
                        </div>
                      </div>
                      <p className="text-[11px] text-gray-400 leading-relaxed">{review.text}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {step === 2 && (
          <div className="animate-slideInRight">
            <h3 className="font-bold text-sm mb-3 text-gray-300 uppercase tracking-wide">Select Date</h3>
            {(() => {
              const today = new Date();
              today.setHours(0, 0, 0, 0);
              const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
              const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
              const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
              const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();
              const prevMonth = () => {
                if (calendarMonth === 0) { setCalendarMonth(11); setCalendarYear(calendarYear - 1); }
                else { setCalendarMonth(calendarMonth - 1); }
              };
              const nextMonth = () => {
                if (calendarMonth === 11) { setCalendarMonth(0); setCalendarYear(calendarYear + 1); }
                else { setCalendarMonth(calendarMonth + 1); }
              };
              const isPastMonth = calendarYear < today.getFullYear() || (calendarYear === today.getFullYear() && calendarMonth < today.getMonth());
              return (
                <div className="mb-5 p-4 rounded-2xl bg-slate-800 border border-slate-700">
                  <div className="flex items-center justify-between mb-3">
                    <button onClick={prevMonth} disabled={isPastMonth} className={`w-9 h-9 rounded-full flex items-center justify-center touch-target ${isPastMonth ? 'opacity-30' : 'bg-slate-700 active:animate-tap'}`}>
                      <Icons.ChevronLeft />
                    </button>
                    <span className="text-sm font-bold">{monthNames[calendarMonth]} {calendarYear}</span>
                    <button onClick={nextMonth} className="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center touch-target active:animate-tap">
                      <Icons.ChevronRight />
                    </button>
                  </div>
                  <div className="grid grid-cols-7 gap-1 mb-2">
                    {dayNames.map((d, i) => (
                      <div key={i} className="text-center text-[10px] font-medium text-gray-500 py-1">{d}</div>
                    ))}
                  </div>
                  <div className="grid grid-cols-7 gap-1">
                    {Array.from({ length: firstDay }, (_, i) => (
                      <div key={'empty-' + i}></div>
                    ))}
                    {Array.from({ length: daysInMonth }, (_, i) => {
                      const day = i + 1;
                      const dateObj = new Date(calendarYear, calendarMonth, day);
                      dateObj.setHours(0, 0, 0, 0);
                      const isPast = dateObj < today;
                      const isSelected = selectedDate && selectedDate.getTime() === dateObj.getTime();
                      const isToday = dateObj.getTime() === today.getTime();
                      return (
                        <button
                          key={day}
                          disabled={isPast}
                          onClick={() => setSelectedDate(dateObj)}
                          className={`w-full aspect-square flex items-center justify-center rounded-xl text-xs font-medium transition-all duration-200 touch-target ${
                            isPast ? 'text-slate-600 cursor-not-allowed'
                              : isSelected ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-500/30'
                              : isToday ? 'bg-slate-700 text-purple-300 font-bold ring-1 ring-purple-500/50'
                              : 'text-gray-200 active:bg-slate-700'
                          }`}
                        >
                          {day}
                        </button>
                      );
                    })}
                  </div>
                </div>
              );
            })()}

            <h3 className="font-bold text-sm mb-3 text-gray-300 uppercase tracking-wide">Select Time</h3>
            <div className="grid grid-cols-3 gap-2 mb-5">
              {timeSlots.map(time => (
                <button
                  key={time}
                  onClick={() => setSelectedTime(time)}
                  className={`px-3 py-3 rounded-xl text-xs font-medium transition-all duration-200 touch-target active:animate-tap ${
                    selectedTime === time
                      ? 'bg-purple-500 text-white shadow-lg shadow-purple-500/30'
                      : 'bg-slate-800 border border-slate-700 text-gray-300'
                  }`}
                >
                  {time}
                </button>
              ))}
            </div>

            <h3 className="font-bold text-sm mb-3 text-gray-300 uppercase tracking-wide">Select Specialist</h3>
            <div className="space-y-2 mb-6">
              {staff.map((name, idx) => (
                <button
                  key={idx}
                  onClick={() => setSelectedStaff(name)}
                  className={`w-full p-3.5 rounded-2xl border text-left transition-all duration-200 flex items-center gap-3 touch-target active:animate-tap ${
                    selectedStaff === name
                      ? 'border-purple-500 bg-purple-500/10'
                      : 'border-slate-700 bg-slate-800'
                  }`}
                >
                  <div className="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-xs font-bold text-purple-300">
                    {name.split(' ').map(n => n[0]).join('')}
                  </div>
                  <span className="font-medium text-sm">{name}</span>
                  {selectedStaff === name && <span className="ml-auto text-purple-400"><Icons.Check /></span>}
                </button>
              ))}
            </div>

            <button
              onClick={() => setStep(3)}
              disabled={!selectedDate || !selectedTime || !selectedStaff}
              className={`w-full py-4 rounded-2xl text-sm font-bold transition-all duration-200 touch-target active:animate-tap ${
                selectedDate && selectedTime && selectedStaff
                  ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-500/30'
                  : 'bg-slate-700 text-gray-500 cursor-not-allowed'
              }`}
            >
              Continue to Summary
            </button>
          </div>
        )}

        {step === 3 && (
          <div className="animate-slideInRight">
            <h3 className="font-bold text-sm mb-3 text-gray-300 uppercase tracking-wide">Booking Summary</h3>
            <div className="p-4 rounded-2xl bg-slate-800 border border-slate-700 space-y-3 mb-5">
              <div className="flex justify-between">
                <span className="text-xs text-gray-400">Venue</span>
                <span className="text-xs font-medium">{venue.name}</span>
              </div>
              <div className="flex justify-between">
                <span className="text-xs text-gray-400">Service</span>
                <span className="text-xs font-medium">{selectedService?.name}</span>
              </div>
              <div className="flex justify-between">
                <span className="text-xs text-gray-400">Date</span>
                <span className="text-xs font-medium">{selectedDate ? selectedDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : ''}</span>
              </div>
              <div className="flex justify-between">
                <span className="text-xs text-gray-400">Time</span>
                <span className="text-xs font-medium">{selectedTime}</span>
              </div>
              <div className="flex justify-between">
                <span className="text-xs text-gray-400">Specialist</span>
                <span className="text-xs font-medium">{selectedStaff}</span>
              </div>
              <div className="border-t border-slate-700 pt-3 flex justify-between">
                <span className="text-xs text-gray-400">Total</span>
                <span className="text-base font-bold text-purple-400">Rs. {selectedService?.price.toLocaleString()}</span>
              </div>
            </div>

            {/* Payment Method */}
            <h3 className="font-bold text-sm mb-3 text-gray-300 uppercase tracking-wide">Payment Method</h3>
            <div className="space-y-2 mb-6">
              <label className={`flex items-center gap-3 p-4 rounded-2xl cursor-pointer transition-all duration-200 touch-target ${paymentMethod === 'venue' ? 'bg-purple-500/10 border border-purple-500/50' : 'bg-slate-800 border border-slate-700'}`}>
                <input
                  type="radio"
                  name="payment"
                  value="venue"
                  checked={paymentMethod === 'venue'}
                  onChange={() => setPaymentMethod('venue')}
                  className="accent-purple-500 w-4 h-4"
                />
                <div className="flex-1">
                  <span className="text-sm font-medium">Pay at Venue</span>
                  <p className="text-[11px] text-gray-400">Pay after your service</p>
                </div>
              </label>
              <label className={`flex items-center gap-3 p-4 rounded-2xl cursor-pointer transition-all duration-200 touch-target ${paymentMethod === 'digital' ? 'bg-purple-500/10 border border-purple-500/50' : 'bg-slate-800 border border-slate-700'}`}>
                <input
                  type="radio"
                  name="payment"
                  value="digital"
                  checked={paymentMethod === 'digital'}
                  onChange={() => setPaymentMethod('digital')}
                  className="accent-purple-500 w-4 h-4"
                />
                <div className="flex-1">
                  <span className="text-sm font-medium">Pay Now via Digital Wallet</span>
                  <p className="text-[11px] text-gray-400">eSewa / Khalti / Fonepay</p>
                </div>
                <Icons.CreditCard />
              </label>
            </div>

            {/* Amount indicator */}
            <div className={`p-4 rounded-2xl mb-6 text-center ${paymentMethod === 'digital' ? 'bg-blue-500/10 border border-blue-500/30' : 'bg-green-500/10 border border-green-500/30'}`}>
              {paymentMethod === 'digital' ? (
                <div>
                  <span className="text-xl font-bold text-blue-400">Rs. {selectedService?.price.toLocaleString()}</span>
                  <p className="text-[11px] text-blue-300 mt-0.5">Due now via digital wallet</p>
                </div>
              ) : (
                <div>
                  <span className="text-xl font-bold text-green-400">Rs. 0</span>
                  <p className="text-[11px] text-green-300 mt-0.5">Pay at venue after service</p>
                </div>
              )}
            </div>

            <button
              onClick={confirmBooking}
              className="w-full py-4 rounded-2xl bg-gradient-to-r from-green-500 to-emerald-500 text-white font-bold text-sm shadow-lg shadow-green-500/30 touch-target active:animate-tap flex items-center justify-center gap-2"
            >
              <Icons.Check /> {paymentMethod === 'digital' ? 'Pay & Confirm' : 'Confirm Booking'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
