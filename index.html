<style>
@keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes progressBar { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
.animate-fadeIn { animation: fadeIn 0.3s ease-out; }
.animate-slideUp { animation: slideUp 0.3s ease-out; }
.animate-pulse-once { animation: pulse 0.5s ease-out; }
.animate-spin { animation: spin 1s linear infinite; }
.animate-shimmer { background: linear-gradient(90deg, #a855f7 25%, #ec4899 50%, #a855f7 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
.animate-progress { animation: progressBar 2.5s ease-in-out forwards; }
@keyframes ripple { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
.animate-ripple { animation: ripple 1.5s ease-out infinite; }
</style>

function App() {
  const [darkMode, setDarkMode] = useState(false);

  const [toast, setToast] = useState(null);

  const [processingPayment, setProcessingPayment] = useState(false);
  const [selectedDate, setSelectedDate] = useState(null);

  // Ride booking state (Pathao integration)
  const [rideOffer, setRideOffer] = useState(null);
  const [rideDetails, setRideDetails] = useState(null);
  const [rideTimer, setRideTimer] = useState(null);

  // Merchant Profile Management State (2-way synced)
  const [merchantServices, setMerchantServices] = useState({});
  const [merchantStaff, setMerchantStaff] = useState({});
  const [merchantGallery, setMerchantGallery] = useState({});
  const [merchantDeals, setMerchantDeals] = useState({});

  const merchantOptions = [
    { id: 'h1', name: 'Durbarmarg Hair Studio' },

    { id: 'tt1', name: "Mohan's Ink Kathmandu" },
    { id: 'pc1', name: 'Paws & Claws Jhamsikhel' },
  ];

  // Functions to get synced data for any venue
  const getServicesForVenue = (venueId, category) => {
    if (merchantServices[venueId] && merchantServices[venueId].length > 0) {
      return merchantServices[venueId];
    }
    return defaultServicesData[category] || [];
  };

  const getStaffForVenue = (venueId) => {
    if (merchantStaff[venueId] && merchantStaff[venueId].length > 0) {
      return merchantStaff[venueId].map(s => s.name);
    }
    return defaultStaffData[venueId] || ['Staff Member 1', 'Staff Member 2', 'Staff Member 3'];
  };

  const getImageForVenue = (venueId) => {
    if (merchantGallery[venueId] && merchantGallery[venueId].length > 0) {
      return merchantGallery[venueId][0];
    }
    return defaultVenueImages[venueId];
  };

  const getDealsForVenue = (venueId) => {
    return merchantDeals[venueId] || [];
  };

  const showToast = (message) => {
    setToast(message);
    setTimeout(() => setToast(null), 3000);
  };

  const openModal = (venue) => {
    setSelectedVenue(venue);
    setBookingStep(1);
    setSelectedService(null);
    setSelectedTime(null);
    setSelectedStaff(null);
    setSelectedDate(null);
    setBookingSuccess(false);
    setPaymentMethod('venue');
    setProcessingPayment(false);
    setRideOffer(null);
    setRideDetails(null);
    setRideTimer(null);
    setModalOpen(true);
  };

  const closeModal = () => {
    setModalOpen(false);
    setSelectedVenue(null);
  };

  const confirmBooking = () => {
    if (paymentMethod === 'digital') {
      setProcessingPayment(true);
      setTimeout(() => {
        const commission = Math.round(selectedService.price * 0.10);
        const merchantId = selectedVenue.id;
        setWalletBalances(prev => ({ ...prev, [merchantId]: (prev[merchantId] || 0) - commission }));

        const newBooking = {
          id: Date.now(),
          venue: selectedVenue.name,
          venueId: selectedVenue.id,
          service: selectedService.name,
          price: selectedService.price,
          time: selectedTime,
          date: selectedDate,
          staff: selectedStaff,
          client: 'Guest Client',
          status: 'upcoming',
          prepaid: true,
        };
        setBookings(prev => [...prev, newBooking]);
        setProcessingPayment(false);
        setBookingSuccess(true);
        showToast(`Payment of Rs. ${selectedService.price.toLocaleString()} processed. Commission Rs. ${commission} deducted.`);
      }, 2800);
    } else {
      const newBooking = {
        id: Date.now(),
        venue: selectedVenue.name,
        venueId: selectedVenue.id,
        service: selectedService.name,
        price: selectedService.price,
        time: selectedTime,
        date: selectedDate,
        staff: selectedStaff,
        client: 'Guest Client',
        status: 'upcoming',
        prepaid: false,
      };
      setBookings(prev => [...prev, newBooking]);
      setBookingSuccess(true);
    }
  };

  const completeBooking = (booking) => {
    const commission = Math.round(booking.price * 0.10);
    const merchantId = booking.venueId;
    if (!booking.prepaid) {
      setWalletBalances(prev => ({ ...prev, [merchantId]: (prev[merchantId] || 0) - commission }));
    }
    setRevenues(prev => ({ ...prev, [merchantId]: (prev[merchantId] || 0) + booking.price }));
    setBookings(prev => prev.filter(b => b.id !== booking.id));
    setCompletedBookings(prev => [...prev, { ...booking, status: 'completed', commission }]);
    showToast(`Completed! Rs. ${booking.price} collected. Commission: Rs. ${commission}`);
  };

  const filteredVenues = venuesData[selectedCategory].filter(v =>
    v.name.toLowerCase().includes(searchQuery.toLowerCase())
  );

  const pendingForMerchant = bookings.filter(b => b.venueId === selectedMerchant);
  const completedForMerchant = completedBookings.filter(b => b.venueId === selectedMerchant);

  return (
    <div className={`min-h-screen transition-all duration-300 ${bgClass}`}>

        <div className="fixed top-4 right-4 z-50 animate-slideUp">
          <div className="bg-green-500 text-white px-6 py-3 rounded-xl shadow-lg flex items-center gap-2">
            <Icons.Check /> {toast}
          </div>
        </div>
      )}

      <header className={`sticky top-0 z-40 backdrop-blur-lg border-b transition-all duration-300 ${darkMode ? 'bg-slate-900/90 border-slate-700' : 'bg-white/90 border-gray-200'}`}>
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
          <h1 className="text-2xl font-bold bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">Fresho</h1>
          <div className="flex items-center gap-3">
            <button onClick={() => setDarkMode(!darkMode)} className={`p-2 rounded-lg transition-all duration-300 ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-gray-100 hover:bg-gray-200'}`}>
              {darkMode ? <Icons.Sun /> : <Icons.Moon />}
            </button>
            <button onClick={() => setView(view === 'client' ? 'provider' : 'client')} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white text-sm font-medium hover:opacity-90 transition-all duration-300">
              <span className="hidden sm:inline">Switch View:</span>
              <span className="font-bold">{view === 'client' ? 'PROVIDER DASHBOARD' : 'CLIENT MARKETPLACE'}</span>
            </button>
          </div>
        </div>
        <div className="max-w-6xl mx-auto px-4 pb-2">
          <div className={`text-xs px-3 py-1 rounded-full inline-block ${view === 'client' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}`}>
            {view === 'client' ? 'CLIENT MARKETPLACE' : 'PROVIDER DASHBOARD'} Active
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-6">
        {view === 'client' ? (
          <ClientView
            darkMode={darkMode}
            cardClass={cardClass}
            inputClass={inputClass}
            selectedCategory={selectedCategory}
            setSelectedCategory={setSelectedCategory}
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
            filteredVenues={filteredVenues}
            openModal={openModal}
            getImageForVenue={getImageForVenue}
            getDealsForVenue={getDealsForVenue}
          />
        ) : (
          <ProviderView
            darkMode={darkMode}
            cardClass={cardClass}

            setSelectedMerchant={setSelectedMerchant}
            merchantOptions={merchantOptions}
            walletBalances={walletBalances}

            merchantServices={merchantServices}
            setMerchantServices={setMerchantServices}
            merchantStaff={merchantStaff}
            setMerchantStaff={setMerchantStaff}
            merchantGallery={merchantGallery}
            setMerchantGallery={setMerchantGallery}
            merchantDeals={merchantDeals}
            setMerchantDeals={setMerchantDeals}

      {modalOpen && selectedVenue && (

  const [newImageUrl, setNewImageUrl] = useState('');

    const updated = [...currentServices];
    updated[index] = { ...updated[index], price: parseInt(newPrice) || 0 };
    setMerchantServices(prev => ({ ...prev, [selectedMerchant]: updated }));

  const addService = () => {
    if (!newServiceName.trim() || !newServicePrice) return;
    const updated = [...currentServices, { name: newServiceName.trim(), price: parseInt(newServicePrice) || 0 }];
    setMerchantServices(prev => ({ ...prev, [selectedMerchant]: updated }));
    setNewServiceName('');
    setNewServicePrice('');

                    {name.split(' ').map(n => n[0]).join('')}
                  </div>
                  <span className="font-medium">{name}</span>
                </button>
              ))}
            </div>
            <div className="flex gap-3">
              <button onClick={() => setStep(1)} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-gray-100 hover:bg-gray-200'}`}>
                Back
              </button>
              <button
                onClick={() => setStep(3)}
                disabled={!selectedDate || !selectedTime || !selectedStaff}
                className={`flex-1 py-2 rounded-lg text-sm font-medium transition-all duration-300 ${
                  selectedDate && selectedTime && selectedStaff
                    ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white hover:opacity-90'
                    : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                }`}
              >
                Continue
              </button>
            </div>
          </div>
        )}

        {step === 3 && (
          <div className="animate-slideUp">
            <h3 className="font-semibold mb-4">Booking Summary</h3>
            <div className={`p-4 rounded-xl border space-y-3 mb-4 ${darkMode ? 'border-slate-600 bg-slate-700/50' : 'border-gray-200 bg-gray-50'}`}>
              <div className="flex justify-between">
                <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Venue</span>
                <span className="text-sm font-medium">{venue.name}</span>
              </div>
              <div className="flex justify-between">
                <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Service</span>
                <span className="text-sm font-medium">{selectedService?.name}</span>
              </div>
              <div className="flex justify-between">
                <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Date</span>
                <span className="text-sm font-medium">{selectedDate ? selectedDate.toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' }) : ''}</span>
              </div>
              <div className="flex justify-between">
                <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Time</span>
                <span className="text-sm font-medium">{selectedTime}</span>
              </div>
              <div className="flex justify-between">
                <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Specialist</span>
                <span className="text-sm font-medium">{selectedStaff}</span>
              </div>
              <div className="flex justify-between">
                <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Price</span>
                <span className="text-sm font-bold text-purple-500">Rs. {selectedService?.price.toLocaleString()}</span>
              </div>
            </div>

            {/* Payment Method Selection */}
            <div className={`p-4 rounded-xl border mb-6 ${darkMode ? 'border-slate-600 bg-slate-700/50' : 'border-gray-200 bg-gray-50'}`}>
              <h4 className="font-semibold mb-3 text-sm">Payment Method</h4>
              <div className="space-y-2">
                <label className={`flex items-center gap-3 p-3 rounded-lg cursor-pointer transition-all duration-200 ${paymentMethod === 'venue' ? (darkMode ? 'bg-slate-600 border border-purple-500' : 'bg-purple-50 border border-purple-300') : (darkMode ? 'bg-slate-700 border border-slate-600' : 'bg-white border border-gray-200')}`}>
                  <input
                    type="radio"
                    name="payment"
                    value="venue"
                    checked={paymentMethod === 'venue'}
                    onChange={() => setPaymentMethod('venue')}
                    className="accent-purple-500"
                  />
                  <div className="flex-1">
                    <span className="text-sm font-medium">Pay at Venue</span>
                    <p className={`text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Rs. 0 due now - pay after your service</p>
                  </div>
                </label>
                <label className={`flex items-center gap-3 p-3 rounded-lg cursor-pointer transition-all duration-200 ${paymentMethod === 'digital' ? (darkMode ? 'bg-slate-600 border border-purple-500' : 'bg-purple-50 border border-purple-300') : (darkMode ? 'bg-slate-700 border border-slate-600' : 'bg-white border border-gray-200')}`}>
                  <input
                    type="radio"
                    name="payment"
                    value="digital"
                    checked={paymentMethod === 'digital'}
                    onChange={() => setPaymentMethod('digital')}
                    className="accent-purple-500"
                  />
                  <div className="flex-1">
                    <span className="text-sm font-medium">Pay Now via Digital Wallet</span>
                    <p className={`text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>eSewa / Khalti / Fonepay - Rs. {selectedService?.price.toLocaleString()}</p>
                  </div>
                  <Icons.CreditCard />
                </label>
              </div>
            </div>

            <div className={`p-3 rounded-lg mb-6 text-center ${paymentMethod === 'digital' ? 'bg-blue-50 border border-blue-200' : (darkMode ? 'bg-slate-700' : 'bg-green-50 border border-green-200')}`}>
              {paymentMethod === 'digital' ? (
                <div>
                  <span className="text-lg font-bold text-blue-600">Rs. {selectedService?.price.toLocaleString()}</span>
                  <p className="text-xs text-blue-500">Due now via digital wallet</p>
                </div>
              ) : (
                <div>
                  <span className="text-lg font-bold text-green-500">Rs. 0</span>
                  <p className={`text-xs ${darkMode ? 'text-gray-400' : 'text-green-600'}`}>Pay at Venue After Service</p>
                </div>
              )}
            </div>

            <div className="flex gap-3">
              <button onClick={() => setStep(2)} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-gray-100 hover:bg-gray-200'}`}>
                Back
              </button>
              <button
                onClick={confirmBooking}
                className="flex-1 py-3 rounded-xl bg-gradient-to-r from-green-500 to-emerald-500 text-white font-medium hover:opacity-90 transition-all duration-300 flex items-center justify-center gap-2"
              >
                <Icons.Check /> {paymentMethod === 'digital' ? 'Pay & Confirm' : 'Confirm Booking'}
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
