const timeSlots = ['9:00 AM', '10:00 AM', '11:30 AM', '1:30 PM', '3:00 PM', '4:00 PM', '5:30 PM'];
function App() {
  const [darkMode, setDarkMode] = useState(false);
  const [view, setView] = useState('client');
  const [selectedCategory, setSelectedCategory] = useState('hair');
  const [searchQuery, setSearchQuery] = useState('');
  const [modalOpen, setModalOpen] = useState(false);
  const [selectedVenue, setSelectedVenue] = useState(null);
  const [bookingStep, setBookingStep] = useState(1);
  const [selectedService, setSelectedService] = useState(null);
  const [selectedTime, setSelectedTime] = useState(null);
  const [selectedStaff, setSelectedStaff] = useState(null);
  const [bookingSuccess, setBookingSuccess] = useState(false);
  const [bookings, setBookings] = useState([]);
  const [completedBookings, setCompletedBookings] = useState([]);
  const [selectedMerchant, setSelectedMerchant] = useState('h1');
  const [walletBalances, setWalletBalances] = useState({ h1: 2500, d1: 5000 });
  const [revenues, setRevenues] = useState({ h1: 0, d1: 0 });
  const [toast, setToast] = useState(null);

  const merchantOptions = [
    { id: 'h1', name: 'Durbarmarg Hair Studio' },
    { id: 'd1', name: 'Kathmandu Dental Clinic' },
  ];

  const showToast = (message) => {
    setToast(message);
    setTimeout(() => setToast(null), 3000);
  };

  const openModal = (venue) => {
    setSelectedVenue(venue);
    setBookingStep(1);
    setSelectedService(null);
    setSelectedTime(null);
    setSelectedStaff(null);
    setBookingSuccess(false);
    setModalOpen(true);
  };

  const closeModal = () => {
    setModalOpen(false);
    setSelectedVenue(null);
  };

  const confirmBooking = () => {
    const newBooking = {
      id: Date.now(),
      venue: selectedVenue.name,
      venueId: selectedVenue.id,
      service: selectedService.name,
      price: selectedService.price,
      time: selectedTime,
      staff: selectedStaff,
      client: 'Guest Client',
      status: 'upcoming',
    };
    setBookings(prev => [...prev, newBooking]);
    setBookingSuccess(true);
  };

  const completeBooking = (booking) => {
    const commission = Math.round(booking.price * 0.10);
    const merchantId = booking.venueId;
    setWalletBalances(prev => ({ ...prev, [merchantId]: (prev[merchantId] || 0) - commission }));
    setRevenues(prev => ({ ...prev, [merchantId]: (prev[merchantId] || 0) + booking.price }));
    setBookings(prev => prev.filter(b => b.id !== booking.id));
    setCompletedBookings(prev => [...prev, { ...booking, status: 'completed', commission }]);
    showToast(`Completed! Rs. ${booking.price} collected. Commission: Rs. ${commission}`);
  };

  const filteredVenues = venuesData[selectedCategory].filter(v =>
    v.name.toLowerCase().includes(searchQuery.toLowerCase())
  );

  const pendingForMerchant = bookings.filter(b => b.venueId === selectedMerchant);
  const completedForMerchant = completedBookings.filter(b => b.venueId === selectedMerchant);

  const bgClass = darkMode ? 'bg-slate-900 text-white' : 'bg-gray-50 text-gray-900';
  const cardClass = darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-gray-200';
  const inputClass = darkMode ? 'bg-slate-700 border-slate-600 text-white placeholder-gray-400' : 'bg-white border-gray-300 text-gray-900 placeholder-gray-500';

  return (
    <div className={`min-h-screen transition-all duration-300 ${bgClass}`}>
      {toast && (
        <div className="fixed top-4 right-4 z-50 animate-slideUp">
          <div className="bg-green-500 text-white px-6 py-3 rounded-xl shadow-lg flex items-center gap-2">
            <Icons.Check /> {toast}
          </div>
        </div>
      )}

      <header className={`sticky top-0 z-40 backdrop-blur-lg border-b transition-all duration-300 ${darkMode ? 'bg-slate-900/90 border-slate-700' : 'bg-white/90 border-gray-200'}`}>
        <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
          <h1 className="text-2xl font-bold bg-gradient-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">Fresho</h1>
          <div className="flex items-center gap-3">
            <button onClick={() => setDarkMode(!darkMode)} className={`p-2 rounded-lg transition-all duration-300 ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-gray-100 hover:bg-gray-200'}`}>
              {darkMode ? <Icons.Sun /> : <Icons.Moon />}
            </button>
            <button onClick={() => setView(view === 'client' ? 'provider' : 'client')} className="flex items-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white text-sm font-medium hover:opacity-90 transition-all duration-300">
              <span className="hidden sm:inline">Switch View:</span>
              <span className="font-bold">{view === 'client' ? 'PROVIDER DASHBOARD' : 'CLIENT MARKETPLACE'}</span>
            </button>
          </div>
        </div>
        <div className="max-w-6xl mx-auto px-4 pb-2">
          <div className={`text-xs px-3 py-1 rounded-full inline-block ${view === 'client' ? 'bg-blue-100 text-blue-700' : 'bg-green-100 text-green-700'}`}>
            {view === 'client' ? 'CLIENT MARKETPLACE' : 'PROVIDER DASHBOARD'} Active
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-6">
        {view === 'client' ? (
          <ClientView
            darkMode={darkMode}
            cardClass={cardClass}
            inputClass={inputClass}
            selectedCategory={selectedCategory}
            setSelectedCategory={setSelectedCategory}
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
            filteredVenues={filteredVenues}
            openModal={openModal}
          />
        ) : (
          <ProviderView
            darkMode={darkMode}
            cardClass={cardClass}
            selectedMerchant={selectedMerchant}
            setSelectedMerchant={setSelectedMerchant}
            merchantOptions={merchantOptions}
            walletBalances={walletBalances}
            revenues={revenues}
            pendingForMerchant={pendingForMerchant}
            completedForMerchant={completedForMerchant}
            completeBooking={completeBooking}
            inputClass={inputClass}
          />
        )}
      </main>

      {modalOpen && selectedVenue && (
        <BookingModal
          darkMode={darkMode}
          cardClass={cardClass}
          venue={selectedVenue}
          category={selectedCategory}
          step={bookingStep}
          setStep={setBookingStep}
          selectedService={selectedService}
          setSelectedService={setSelectedService}
          selectedTime={selectedTime}
          setSelectedTime={setSelectedTime}
          selectedStaff={selectedStaff}
          setSelectedStaff={setSelectedStaff}
          bookingSuccess={bookingSuccess}
          confirmBooking={confirmBooking}
          closeModal={closeModal}
        />
      )}
    </div>
  );
}
function ClientView({ darkMode, cardClass, inputClass, selectedCategory, setSelectedCategory, searchQuery, setSearchQuery, filteredVenues, openModal }) {
  return (
    <div className="animate-fadeIn">
      <div className="flex items-center gap-2 mb-4">
        <span className="text-purple-500"><Icons.MapPin /></span>
        <span className={`text-sm font-medium ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Kathmandu, Nepal</span>
      </div>

      <div className="relative mb-6">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><Icons.Search /></span>
        <input
          type="text"
          placeholder="Search venues..."
          value={searchQuery}
          onChange={(e) => setSearchQuery(e.target.value)}
          className={`w-full pl-10 pr-4 py-3 rounded-xl border transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-purple-500 ${inputClass}`}
        />
      </div>

      <div className="flex gap-2 overflow-x-auto pb-4 mb-6 scrollbar-hide">
        {categories.map(cat => (
          <button
            key={cat.id}
            onClick={() => setSelectedCategory(cat.id)}
            className={`flex items-center gap-2 px-4 py-2 rounded-full whitespace-nowrap text-sm font-medium transition-all duration-300 ${
              selectedCategory === cat.id
                ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white shadow-lg shadow-purple-500/25'
                : darkMode ? 'bg-slate-800 text-gray-300 hover:bg-slate-700' : 'bg-white text-gray-600 hover:bg-gray-100 border border-gray-200'
            }`}
          >
            <span>{cat.emoji}</span>
            <span>{cat.name}</span>
          </button>
        ))}
      </div>

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        {filteredVenues.map(venue => (
          <div key={venue.id} className={`rounded-xl border overflow-hidden transition-all duration-300 hover:shadow-xl hover:-translate-y-1 ${cardClass}`}>
            <div className={`h-32 bg-gradient-to-br ${venue.gradient} flex items-end p-4`}>
              <div className="bg-white/20 backdrop-blur-sm rounded-lg px-2 py-1 text-white text-xs font-medium">
                {categories.find(c => c.id === selectedCategory)?.emoji} {categories.find(c => c.id === selectedCategory)?.name}
              </div>
            </div>
            <div className="p-4">
              <h3 className="font-semibold text-lg mb-2">{venue.name}</h3>
              <div className="flex items-center gap-4 mb-3">
                <div className="flex items-center gap-1 text-yellow-500">
                  <Icons.Star />
                  <span className="text-sm font-medium">{venue.rating}</span>
                </div>
                <div className={`flex items-center gap-1 text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                  <Icons.MapPin />
                  <span>{venue.distance} km</span>
                </div>
              </div>
              <button
                onClick={() => openModal(venue)}
                className="w-full py-2 rounded-lg bg-gradient-to-r from-purple-500 to-pink-500 text-white text-sm font-medium hover:opacity-90 transition-all duration-300 flex items-center justify-center gap-2"
              >
                View Services <Icons.ChevronRight />
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function ProviderView({ darkMode, cardClass, selectedMerchant, setSelectedMerchant, merchantOptions, walletBalances, revenues, pendingForMerchant, completedForMerchant, completeBooking, inputClass }) {
  const walletBalance = walletBalances[selectedMerchant] || 0;
  const revenue = revenues[selectedMerchant] || 0;
  const lowBalance = walletBalance < 200;

  return (
    <div className="animate-fadeIn">
      <div className="mb-6">
        <label className={`text-sm font-medium mb-2 block ${darkMode ? 'text-gray-300' : 'text-gray-600'}`}>Active Merchant</label>
        <select
          value={selectedMerchant}
          onChange={(e) => setSelectedMerchant(e.target.value)}
          className={`w-full sm:w-auto px-4 py-3 rounded-xl border transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-purple-500 ${inputClass}`}
        >
          {merchantOptions.map(m => (
            <option key={m.id} value={m.id}>{m.name}</option>
          ))}
        </select>
      </div>

      {lowBalance && (
        <div className="mb-6 p-4 rounded-xl bg-yellow-50 border border-yellow-200 flex items-center gap-3">
          <span className="text-yellow-600"><Icons.AlertTriangle /></span>
          <span className="text-yellow-800 text-sm font-medium">Low Balance: Top up via eSewa to avoid listing suspension.</span>
        </div>
      )}

      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div className={`p-5 rounded-xl border ${cardClass}`}>
          <div className="flex items-center gap-3 mb-3">
            <div className="p-2 rounded-lg bg-purple-100 text-purple-600"><Icons.Wallet /></div>
            <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Prepaid Wallet Balance</span>
          </div>
          <p className="text-2xl font-bold">Rs. {walletBalance.toLocaleString()}</p>
        </div>
        <div className={`p-5 rounded-xl border ${cardClass}`}>
          <div className="flex items-center gap-3 mb-3">
            <div className="p-2 rounded-lg bg-green-100 text-green-600"><Icons.TrendingUp /></div>
            <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Revenue Generated Today</span>
          </div>
          <p className="text-2xl font-bold">Rs. {revenue.toLocaleString()}</p>
        </div>
        <div className={`p-5 rounded-xl border ${cardClass}`}>
          <div className="flex items-center gap-3 mb-3">
            <div className="p-2 rounded-lg bg-blue-100 text-blue-600"><Icons.Calendar /></div>
            <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Pending Bookings</span>
          </div>
          <p className="text-2xl font-bold">{pendingForMerchant.length}</p>
        </div>
      </div>

      <div className="mb-8">
        <h2 className="text-xl font-bold mb-4 flex items-center gap-2"><Icons.Clock /> Upcoming Appointments</h2>
        {pendingForMerchant.length === 0 ? (
          <div className={`p-8 rounded-xl border text-center ${cardClass}`}>
            <p className={`${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>No upcoming appointments. Bookings made in the Client Marketplace will appear here.</p>
          </div>
        ) : (
          <div className="space-y-3">
            {pendingForMerchant.map(booking => (
              <div key={booking.id} className={`p-4 rounded-xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${cardClass}`}>
                <div>
                  <div className="flex items-center gap-2 mb-1">
                    <Icons.User />
                    <span className="font-medium">{booking.client}</span>
                  </div>
                  <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                    {booking.service} - {booking.time} - Staff: {booking.staff}
                  </p>
                  <p className="text-sm font-semibold text-purple-500">Rs. {booking.price.toLocaleString()}</p>
                </div>
                <button
                  onClick={() => completeBooking(booking)}
                  className="px-4 py-2 rounded-lg bg-green-500 text-white text-sm font-medium hover:bg-green-600 transition-all duration-300 flex items-center gap-2 whitespace-nowrap"
                >
                  <Icons.Check /> Complete & Collect
                </button>
              </div>
            ))}
          </div>
        )}
      </div>

      {completedForMerchant.length > 0 && (
        <div>
          <h2 className="text-xl font-bold mb-4 flex items-center gap-2"><Icons.Check /> Completed</h2>
          <div className="space-y-3">
            {completedForMerchant.map(booking => (
              <div key={booking.id} className={`p-4 rounded-xl border opacity-75 ${cardClass}`}>
                <div className="flex items-center gap-2 mb-1">
                  <Icons.User />
                  <span className="font-medium">{booking.client}</span>
                  <span className="ml-auto text-xs px-2 py-1 rounded-full bg-green-100 text-green-700">Completed</span>
                </div>
                <p className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>
                  {booking.service} - Rs. {booking.price.toLocaleString()} (Commission: Rs. {booking.commission})
                </p>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}
function BookingModal({ darkMode, cardClass, venue, category, step, setStep, selectedService, setSelectedService, selectedTime, setSelectedTime, selectedStaff, setSelectedStaff, bookingSuccess, confirmBooking, closeModal }) {
  const services = servicesData[category] || [];
  const staff = staffData[venue.id] || ['Staff Member 1', 'Staff Member 2', 'Staff Member 3'];
  const modalBg = darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-gray-200';

  if (bookingSuccess) {
    return (
      <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={closeModal}>
        <div className={`w-full max-w-md rounded-2xl border p-8 text-center animate-fadeIn ${modalBg}`} onClick={e => e.stopPropagation()}>
          <div className="text-green-500 flex justify-center mb-4 animate-pulse-once"><Icons.CheckCircle /></div>
          <h3 className="text-2xl font-bold mb-2">Booking Confirmed!</h3>
          <p className={`mb-4 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Your appointment at {venue.name} has been booked successfully.</p>
          <p className={`text-sm mb-6 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>{selectedService?.name} - {selectedTime} with {selectedStaff}</p>
          <button onClick={closeModal} className="px-6 py-3 rounded-xl bg-gradient-to-r from-purple-500 to-pink-500 text-white font-medium hover:opacity-90 transition-all duration-300">
            Done
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm" onClick={closeModal}>
      <div className={`w-full max-w-lg max-h-[90vh] overflow-y-auto rounded-2xl border p-6 animate-fadeIn ${modalBg}`} onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-6">
          <div>
            <h2 className="text-xl font-bold">{venue.name}</h2>
            <div className="flex items-center gap-2 mt-1">
              {[1, 2, 3].map(s => (
                <div key={s} className={`w-8 h-1 rounded-full ${s <= step ? 'bg-purple-500' : darkMode ? 'bg-slate-600' : 'bg-gray-200'}`} />
              ))}
              <span className={`text-xs ml-2 ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Step {step} of 3</span>
            </div>
          </div>
          <button onClick={closeModal} className={`p-2 rounded-lg transition-all duration-300 ${darkMode ? 'hover:bg-slate-700' : 'hover:bg-gray-100'}`}>
            <Icons.X />
          </button>
        </div>

        {step === 1 && (
          <div className="animate-slideUp">
            <h3 className="font-semibold mb-4">Select a Service</h3>
            <div className="space-y-2">
              {services.map((service, idx) => (
                <button
                  key={idx}
                  onClick={() => { setSelectedService(service); setStep(2); }}
                  className={`w-full p-4 rounded-xl border text-left transition-all duration-300 flex items-center justify-between ${
                    selectedService?.name === service.name
                      ? 'border-purple-500 bg-purple-50 dark:bg-purple-900/20'
                      : darkMode ? 'border-slate-600 hover:border-slate-500' : 'border-gray-200 hover:border-gray-300'
                  }`}
                >
                  <span className="font-medium">{service.name}</span>
                  <span className="text-purple-500 font-semibold">Rs. {service.price.toLocaleString()}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {step === 2 && (
          <div className="animate-slideUp">
            <h3 className="font-semibold mb-4">Select Time</h3>
            <div className="grid grid-cols-3 sm:grid-cols-4 gap-2 mb-6">
              {timeSlots.map(time => (
                <button
                  key={time}
                  onClick={() => setSelectedTime(time)}
                  className={`px-3 py-2 rounded-lg text-sm font-medium transition-all duration-300 ${
                    selectedTime === time
                      ? 'bg-purple-500 text-white'
                      : darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-gray-100 hover:bg-gray-200'
                  }`}
                >
                  {time}
                </button>
              ))}
            </div>
            <h3 className="font-semibold mb-4">Select Specialist</h3>
            <div className="space-y-2 mb-6">
              {staff.map((name, idx) => (
                <button
                  key={idx}
                  onClick={() => setSelectedStaff(name)}
                  className={`w-full p-3 rounded-xl border text-left transition-all duration-300 flex items-center gap-3 ${
                    selectedStaff === name
                      ? 'border-purple-500 bg-purple-50 dark:bg-purple-900/20'
                      : darkMode ? 'border-slate-600 hover:border-slate-500' : 'border-gray-200 hover:border-gray-300'
                  }`}
                >
                  <div className={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold ${darkMode ? 'bg-slate-600' : 'bg-gray-200'}`}>
                    {name.split(' ').map(n => n[0]).join('')}
                  </div>
                  <span className="font-medium">{name}</span>
                </button>
              ))}
            </div>
            <div className="flex gap-3">
              <button onClick={() => setStep(1)} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-gray-100 hover:bg-gray-200'}`}>
                Back
              </button>
              <button
                onClick={() => setStep(3)}
                disabled={!selectedTime || !selectedStaff}
                className={`flex-1 py-2 rounded-lg text-sm font-medium transition-all duration-300 ${
                  selectedTime && selectedStaff
                    ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white hover:opacity-90'
                    : 'bg-gray-300 text-gray-500 cursor-not-allowed'
                }`}
              >
                Continue
              </button>
            </div>
          </div>
        )}

        {step === 3 && (
          <div className="animate-slideUp">
            <h3 className="font-semibold mb-4">Booking Summary</h3>
            <div className={`p-4 rounded-xl border space-y-3 mb-6 ${darkMode ? 'border-slate-600 bg-slate-700/50' : 'border-gray-200 bg-gray-50'}`}>
              <div className="flex justify-between">
                <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Venue</span>
                <span className="text-sm font-medium">{venue.name}</span>
              </div>
              <div className="flex justify-between">
                <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Service</span>
                <span className="text-sm font-medium">{selectedService?.name}</span>
              </div>
              <div className="flex justify-between">
                <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Time</span>
                <span className="text-sm font-medium">{selectedTime}</span>
              </div>
              <div className="flex justify-between">
                <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Specialist</span>
                <span className="text-sm font-medium">{selectedStaff}</span>
              </div>
              <div className="flex justify-between">
                <span className={`text-sm ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Price</span>
                <span className="text-sm font-bold text-purple-500">Rs. {selectedService?.price.toLocaleString()}</span>
              </div>
              <hr className={`${darkMode ? 'border-slate-600' : 'border-gray-200'}`} />
              <div className="flex justify-between items-center">
                <span className="text-sm font-semibold">Amount Due Today</span>
                <div className="text-right">
                  <span className="text-lg font-bold text-green-500">Rs. 0</span>
                  <p className={`text-xs ${darkMode ? 'text-gray-400' : 'text-gray-500'}`}>Pay at Venue After Service</p>
                </div>
              </div>
            </div>
            <div className="flex gap-3">
              <button onClick={() => setStep(2)} className={`px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 ${darkMode ? 'bg-slate-700 hover:bg-slate-600' : 'bg-gray-100 hover:bg-gray-200'}`}>
                Back
              </button>
              <button
                onClick={confirmBooking}
                className="flex-1 py-3 rounded-xl bg-gradient-to-r from-green-500 to-emerald-500 text-white font-medium hover:opacity-90 transition-all duration-300 flex items-center justify-center gap-2"
              >
                <Icons.Check /> Confirm Booking
              </button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
